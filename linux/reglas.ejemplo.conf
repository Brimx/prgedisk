# Copiar a ~/.config/prgedisk/reglas.conf
#
# Formato:  NIVEL|regex|motivo
# Niveles:  SEGURO, REVISAR, DESCONOCIDO, NUNCA
#
# Se evalúan ANTES de las reglas internas: sirven para proteger o para marcar
# una excepción concreta. El motivo no debe contener "|".
# $HOME se expande a tu home (dentro de la regex).
#
# Ejemplos (descomentar y ajustar):
#
# Proteger los datos de una app que no conocemos:
# NUNCA|^$HOME/\.config/mi-app|datos de mi-app
#
# Marcar como SEGURO una cache que la app deja fuera de ~/.cache:
# SEGURO|^$HOME/\.local/share/mi-app/cache|se regenera
#
# Dejar algo en REVISAR para decidirlo a mano:
# REVISAR|^$HOME/\.local/share/mi-app/tmp|temporal de mi-app
